name: Account Service CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      options: --user root
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgresql://postgres:postgres@postgres:5432/testdb
      FLASK_ENV: testing
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@postgres:5432/testdb

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libpq-dev
          rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint nose coverage psycopg2-binary

      - name: Lint with flake8
        run: flake8 service tests run.py

      - name: Run unit tests with nose
        run: nosetests --with-coverage --cover-package=service --cover-erase
