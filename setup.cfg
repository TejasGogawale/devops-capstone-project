[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 95

[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv,.venv,build,dist
extend-ignore = E203,W503
per-file-ignores =
    __init__.py:F401,F403

[pylint]
max-line-length = 100
disable = C0114,C0115,C0116,E1101
